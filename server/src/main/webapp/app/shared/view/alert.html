<!-- Localization completed -->
<div class="modal-body confirm">
  <span>{{message}}</span>
  <div>
    <button class="btn btn-default" ng-click="OK()">
      {{okButtonTextKey | localize}}
    </button>
  </div>
  <div class="modal-header">
    <button type="button" class="close" ng-click="OK()">&times;</button>

    <h4 class="modal-title">
      <i class="glyphicon glyphicon-info-sign"></i>
      {{'alert.title' | localization}}
    </h4>
  </div>

  <div class="modal-body">
    <p>{{message}}</p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" ng-click="OK()">
      {{okButtonTextKey | localization}}
    </button>
  </div>
</div>
